<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext x=%2716%27 y=%2726%27 font-size=%2728%27 text-anchor=%27middle%27 font-family=%27Georgia%27 fill=%27%236b4f2a%27%3E%C2%B6%3C/text%3E%3C/svg%3E">
  <title>you-annotate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="/static/css/reader.css">
  <script type="module" src="/static/js/reader.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="home" href="/">you-annotate</a>
    <span class="text-title" id="text-title"></span>
    <nav class="chapter-nav">
      <button type="button" id="prev" title="Previous chapter">‹</button>
      <select id="chapter-select" aria-label="Chapter"></select>
      <button type="button" id="next" title="Next chapter">›</button>
    </nav>
    <div class="who" id="who"></div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main class="page" id="page">
    <aside class="margin margin-left" id="margin-left"></aside>
    <article class="text-column">
      <h1 class="chapter-title" id="chapter-title"></h1>
      <div class="chapter" id="chapter"></div>
      <nav class="chapter-foot">
        <button type="button" class="link-button" id="prev-foot">‹ Previous chapter</button>
        <button type="button" class="link-button" id="next-foot">Next chapter ›</button>
      </nav>
    </article>
    <aside class="margin margin-right" id="margin-right"></aside>
  </main>

  <aside class="panel" id="panel" aria-label="Comments"></aside>
  <div class="toolbar" id="toolbar" hidden></div>

  <dialog id="join-dialog">
    <form id="join-form">
      <h2>Join to annotate</h2>
      <p>Your name is shown on everything you add. Annotations you make can only be edited from this browser.</p>
      <label>Your name <input name="name" required maxlength="60" autocomplete="name"></label>
      <label>Class passcode <input name="passcode" required autocomplete="off"></label>
      <p class="error" id="join-error"></p>
      <div class="actions">
        <button type="button" class="btn" id="join-cancel">Cancel</button>
        <button class="btn primary">Join</button>
      </div>
    </form>
  </dialog>
</body>
</html>
