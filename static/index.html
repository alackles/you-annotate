<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext x=%2716%27 y=%2726%27 font-size=%2728%27 text-anchor=%27middle%27 font-family=%27Georgia%27 fill=%27%236b4f2a%27%3E%C2%B6%3C/text%3E%3C/svg%3E">
  <title>you-annotate</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
  <link rel="stylesheet" href="/static/css/reader.css">
</head>
<body>
  <main class="simple-page">
    <h1>you-annotate</h1>
    <ul class="text-list" id="texts"></ul>
    <p><a href="/admin">Instructor login</a></p>
  </main>
  <script type="module">
    import { api } from '/static/js/api.js';
    const list = document.getElementById('texts');
    const texts = await api('GET', '/api/texts');
    if (!texts.length) list.innerHTML = '<li><em>No texts yet.</em></li>';
    for (const t of texts) {
      const a = Object.assign(document.createElement('a'), { href: `/t/${t.slug}`, textContent: t.title });
      const li = document.createElement('li');
      li.append(a);
      list.append(li);
    }
  </script>
</body>
</html>
