app = "you-annotate"
primary_region = "ord"

[build]

[env]
  DB_PATH = "/data/annotate.db"

# SQLite lives on this volume. One volume => one machine, which the in-memory live-update
# hub also requires. Deploy with `fly deploy --ha=false`.
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
